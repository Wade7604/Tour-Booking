# Frontend CI - Validate HTML/CSS/JS + Cypress E2E Tests
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cypress/**'
      - 'cypress.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cypress/**'
      - 'cypress.config.js'

jobs:
  check:
    name: 🔍 Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Verify frontend files exist
        run: |
          echo "📄 Checking frontend structure..."
          test -f frontend/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"
          ls -la frontend/

  cypress-api-tests:
    name: 🧪 Cypress API Tests
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run API health check tests
        run: npm run cy:run:api

      # Vercel tự động deploy khi push vào main
      # Không cần thêm step deploy ở đây
