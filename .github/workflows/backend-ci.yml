# Backend CI - Chạy khi có PR hoặc push vào main
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  check:
    name: 🔍 Lint & Check Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install
        working-directory: ./backend

      - name: 🔍 Check syntax (dry run)
        run: node --check server.js && node --check src/app.js

      # Uncomment khi đã thêm ESLint vào project
      # - name: 🧹 Run ESLint
      #   run: npx eslint src/ --ext .js

      # Uncomment khi đã viết tests
      # - name: 🧪 Run Tests
      #   run: npm test
      #   env:
      #     NODE_ENV: test
